<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO APP - Lista de Tarea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app-container">
    <h1 class="app-title">TODO APP</h1>

    <div class="card">
      <!-- Formulario Frontend (Lista de Tarea) -->
      <form id="todo-form" novalidate>
        <div class="form-group">
          <label for="input-name">Nombre</label>
          <input type="text" id="input-name" placeholder="Luis Montano" autocomplete="off">
          <p id="error-name" class="error-msg hidden">Tiene que tener nombre y apellido. Ambos comienzan con mayúsculas.</p>
        </div>

        <div class="form-group">
          <label for="input-phone">Numero</label>
          <input type="tel" id="input-phone" placeholder="04141234567" autocomplete="off">
          <p id="error-phone" class="error-msg hidden">El número de teléfono no es válido.</p>
        </div>

        <button type="submit" id="btn-submit">CREAR</button>
      </form>

      <!-- Lista de Elementos Renderizados -->
      <ul id="task-list" class="task-list"></ul>

      <!-- Badges de Contadores (Backend Logic de TODO App) -->
      <div class="counters">
        <div class="badge badge-total">Total: <span id="count-total">0</span></div>
        <div class="badge badge-completed">Completed: <span id="count-completed">0</span></div>
        <div class="badge badge-incomplete">Incompleted: <span id="count-incomplete">0</span></div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
