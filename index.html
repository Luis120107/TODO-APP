<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarea</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="container">
    <h1 class="title">Lista de Tarea</h1>

    <!-- Formulario para Crear Contacto -->
    <form id="contact-form" class="card form-card" novalidate>
      <div class="form-group">
        <label for="input-name">Nombre</label>
        <input type="text" id="input-name" placeholder="Luis Montano" autocomplete="off">
        <p id="error-name" class="error-message hidden">Tiene que tener nombre y apellido. Ambos comienzan con mayúsculas.</p>
      </div>

      <div class="form-group">
        <label for="input-phone">Numero</label>
        <input type="tel" id="input-phone" placeholder="04141234567" autocomplete="off">
        <p id="error-phone" class="error-message hidden">El número de teléfono no es válido.</p>
      </div>

      <button type="submit" id="btn-create">CREAR</button>
    </form>

    <!-- Lista de Tarea Renderizada -->
    <div class="card list-card">
      <ul id="contact-list" class="contact-list"></ul>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
