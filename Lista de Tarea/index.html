<<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO APP</title>
  <!-- Fuente Orbitron para el título idéntico -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-wrapper">
    <h1 class="app-title">TODO APP</h1>

    <div class="todo-card">
      <!-- Input Area -->
      <div class="input-row">
        <input type="text" id="task-input" placeholder="Create some task..." autocomplete="off">
        <button id="add-btn" aria-label="Añadir">+</button>
      </div>

      <!-- Mensaje de Error Exacto -->
      <div id="error-msg" class="error-text hidden">A task must be provided.</div>

      <!-- Lista de Tareas -->
      <ul id="task-list" class="task-list"></ul>

      <!-- Contadores en la parte inferior -->
      <div class="counters-row">
        <div class="counter-badge badge-total">Total: <span id="count-total">0</span></div>
        <div class="counter-badge badge-completed">Completed: <span id="count-completed">0</span></div>
        <div class="counter-badge badge-incomplete">Incompleted: <span id="count-incomplete">0</span></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
